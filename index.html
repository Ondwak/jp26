<div id="lock" class="hidden" style="position:fixed;inset:0;z-index:20;background:var(--md-sys-color-background);display:grid;place-items:center;padding:24px">

</div>
<script>
(() => {
const LS0 = k => { try { return localStorage.getItem(k); } catch(_){ return null; } };
const S = { days:null, bookings:null, log:null, meta:null, view:'dnes', day:null, fromApp:false, bkFilter:'all', denikTab:(LS0('jp-denik')||'log'), finOpen:!!LS0('jp-fin'), memories:null, open:new Set(), stale:false };
const STATUS = { paid:['Zaplaceno','check_circle'], booked:['Rezervováno','event_available'], unverified:['Ověřit','help'], todo:['Zarezervovat','pending'], cancelled:['Zrušeno','cancel'] };
const PLAN = {
  now:  ['Zamknout teď','lock','Vyprodá se, má termín, nebo bez toho den nefunguje.'],
  flex: ['Teď, se stornem zdarma','event_repeat','Zarezervovat hned s bezplatným zrušením: místo je jisté a dá se s ním hýbat.'],
  trip: ['Až na cestě','luggage','Rozhodnout podle počasí a nálady, stačí pár dní předem. U každé je napsané nejpozději kdy.'],

const WD = ['ne','po','út','st','čt','pá','so'];
const WDL = ['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
const TAGCLS = { 'rezervace':'res', 'klidné':'quiet', 'zavřeno':'warn', 'pozor':'warn', 'Ondra':'who', 'Verča':'who', 'Viktor':'who', 'kluci':'who', 'Claude tip':'ai' };
const LS = { get(k){ try { return localStorage.getItem(k); } catch(_){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(_){} }, del(k){ try { localStorage.removeItem(k); } catch(_){} } };

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false && k !== '') el.append(k.nodeType ? k : String(k));
  return el;
}
const ic = (name, cls) => h('span', { class:'ms' + (cls ? ' ' + cls : ''), 'aria-hidden':'true' }, name);
const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
const tokyoDate = (d = new Date()) => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const tz = z => new Intl.DateTimeFormat('cs-CZ',{timeZone:z,hour:'2-digit',minute:'2-digit'}).format(new Date());
function parts(iso){ const [y,m,d] = iso.split('-').map(Number); return { y, m, d, wd: new Date(Date.UTC(y,m-1,d)).getUTCDay() }; }
function fmtDate(iso){ const p = parts(iso); return `${WD[p.wd]} ${p.d}. ${p.m}.`; }
const rate = () => Number(S.meta && S.meta.kcPerYen) || 0.13;
const yen = n => '¥' + Number(n).toLocaleString('cs-CZ');
const kc = n => Math.round(n * rate()).toLocaleString('cs-CZ') + ' Kč';
const mapUrl = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);

function setTheme(light){
  if (light) document.documentElement.setAttribute('data-theme','light'); else document.documentElement.removeAttribute('data-theme');
  LS.set('jp-theme', light ? 'light' : 'dark');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--md-sys-color-background').trim() || (light ? '#fdf7ff' : '#141318'));
  const b = document.getElementById('themebtn'); b.firstChild.textContent = light ? 'dark_mode' : 'light_mode'; b.setAttribute('aria-label', light ? 'Přepnout na tmavý režim' : 'Přepnout na světlý režim');
}
setTheme(document.documentElement.getAttribute('data-theme') === 'light');
document.getElementById('themebtn').addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') !== 'light'));
function clock(){ document.getElementById('ctk').textContent = tz('Asia/Tokyo'); document.getElementById('cpr').textContent = tz('Europe/Prague'); }
clock(); setInterval(clock, 20000);
function showBanner(msg){ document.getElementById('bannertext').textContent = msg || ''; document.getElementById('banner').classList.toggle('hidden', !msg); }

/* ticks, shared between phones: local copy {hash:{d:0|1,t:ms}}, synced encrypted through ntfy.sh (meta.tickTopic) */
function hk(str){ let a = 0x811c9dc5, b = 0x01000193 ^ str.length; for (let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); a = Math.imul(a ^ c, 16777619); b = Math.imul(b ^ c, 2246822519); } return (a >>> 0).toString(36) + (b >>> 0).toString(36); }
const tickKey = (date, text) => hk(date + '|' + text);
const ticks = (() => {
  let o = {}; try { o = JSON.parse(LS.get('jp-ticks') || '{}'); } catch(_){}
  const out = {};
  for (const [k,v] of Object.entries(o)){
    if (v && typeof v === 'object') out[k] = v;
    else if (v) out[k.includes('|') ? hk(k) : k] = { d:1, t:1 };
  }
  return out;
})();
const tickOn = k => !!(ticks[k] && ticks[k].d);
const saveTicks = () => LS.set('jp-ticks', JSON.stringify(ticks));
const TS = { key:null, timer:null, busy:false };
const pack64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
async function tsKey(pw){
  if (!TS.key){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    TS.key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:new TextEncoder().encode('jp26-ticks-v1'), iterations:100000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  }
  return TS.key;
}
async function zip(bytes, how){ const cs = how === 'in' ? new CompressionStream('deflate-raw') : new DecompressionStream('deflate-raw'); return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer()); }
async function tsPack(map, pw){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await tsKey(pw), await zip(new TextEncoder().encode(JSON.stringify(map)), 'in'));
  return 't1.' + pack64(iv) + '.' + pack64(ct);
}
async function tsUnpack(msg, pw){
  const [v, iv, ct] = String(msg).split('.'); if (v !== 't1') return null;
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(iv) }, await tsKey(pw), b64(ct));
  return JSON.parse(new TextDecoder().decode(await zip(pt, 'out')));
}
function tsMerge(into, from){ let ch = false; for (const [k,v] of Object.entries(from || {})){ if (!v || typeof v.t !== 'number') continue; if (!into[k] || into[k].t < v.t){ into[k] = { d: v.d ? 1 : 0, t: v.t }; ch = true; } } return ch; }
async function tickSync(pw){
  const topic = S.meta && S.meta.tickTopic; if (!topic || TS.busy) return;
  TS.busy = true;
  try {
    const r = await fetch('https://ntfy.sh/' + topic + '/json?poll=1&since=12h', { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    const remote = {};
    for (const line of (await r.text()).split('\n')){
      if (!line.trim()) continue;
      try { const m = JSON.parse(line); if (m.event === 'message') tsMerge(remote, await tsUnpack(m.message, pw)); } catch(_){}
    }
    if (tsMerge(ticks, remote)){ saveTicks(); if (!document.querySelector('input:focus')) render(); }
    const behind = Object.entries(ticks).some(([k,v]) => !remote[k] || remote[k].t < v.t);
    if (behind || !Object.keys(remote).length && Object.keys(ticks).length){
      await fetch('https://ntfy.sh/' + topic, { method:'POST', body: await tsPack(ticks, pw) });
    }
  } catch(_){ /* offline: local ticks stay, next sync pushes them */ }
  TS.busy = false;
}
function tickSoon(){ clearTimeout(TS.timer); TS.timer = setTimeout(() => { const pw = LS.get('jp-pw'); if (pw) tickSync(pw); }, 1200); }

function det(key, cls, defOpen, summary, body){
  const isOpen = S.open.has(key) || (defOpen && !S.open.has('!' + key));
  const d = h('details', { class: cls, open: isOpen }, summary, body);
  d.addEventListener('toggle', () => { if (d.open){ S.open.add(key); S.open.delete('!' + key); } else { S.open.delete(key); S.open.add('!' + key); } });
  return d;
}

const sortedDays = () => (S.days || []).slice().sort((a,b) => a.date < b.date ? -1 : 1);
const bookingById = id => (S.bookings || []).find(b => b._id === id);
// Shown: tags that warn or mark a booking, and who the tip came from. The rest stay in the data but add noise on a phone.
const SHOW_TAGS = new Set(['rezervace','zavřeno','pozor','Claude tip','Gebrian','Verča','Ondra','Viktor','kluci','Suguru','Dominik','cestovka']);
function tagsEl(list){ const t = arr(list).filter(x => SHOW_TAGS.has(x)); return t.length ? h('div',{class:'tags'}, t.map(x => h('span',{class:'tag ' + (TAGCLS[x] || '')}, x))) : null; }
function linksEl(it){
  const l = [];
  if (it.map) l.push(h('a',{class:'lbtn', href:mapUrl(it.map), target:'_blank', rel:'noopener'}, ic('location_on','sm'), 'Mapa'));
  if (it.link) l.push(h('a',{class:'lbtn', href:it.link, target:'_blank', rel:'noopener'}, ic('open_in_new','sm'), it.linkLabel || 'Web'));
  if (it.tel) l.push(h('a',{class:'lbtn', href:'tel:' + it.tel.replace(/[^\d+]/g,'')}, ic('call','sm'), it.tel));
  return l.length ? h('div',{class:'links'}, l) : null;
}
let actSeq = 0;
// it.done marks a dish (or anything) already tried: green check before the name.
const doneIc = it => it && it.done ? h('span',{class:'ms sm done', title:'Ochutnáno', 'aria-label':'Ochutnáno'}, 'check_circle') : null;
function itemEl(it){
  if (typeof it === 'string') return h('div',{class:'item'}, h('div',{class:'tx', style:'margin:0;color:var(--md-sys-color-on-surface)'}, it));
  const rich = it.short || it.why || it.facts || it.tips || it.source;
  if (!rich) return h('div',{class:'item'}, it.name ? h('div',{class:'nm'}, doneIc(it), it.name) : null, it.text ? h('div',{class:'tx'}, it.text) : null, tagsEl(it.tags), linksEl(it));
  const facts = arr(it.facts).filter(f => Array.isArray(f) && f.length >= 2);
  const body = h('div',{class:'actbody'},
    it.text ? h('div',{class:'tx'}, it.text) : null,
    it.why ? h('div',{class:'whybox'}, ic('favorite'), h('span',null, it.why)) : null,
    facts.length ? h('dl',{class:'facts'}, facts.flatMap(f => [h('dt',null,f[0]), h('dd',null,f[1])])) : null,
    arr(it.tips).length ? h('ul',{class:'tips'}, arr(it.tips).map(t => h('li',null,t))) : null,
    linksEl(it),
    it.source ? h('div',{class:'src'}, 'Zdroj: ' + it.source) : null);
  const key = 'act|' + (it.name || '') + '|' + (actSeq++);
  return det(key, 'act', false, h('summary',null, h('div',null, h('div',{class:'nm'}, doneIc(it), it.name || ''), it.short ? h('div',{class:'sh'}, it.short) : null, tagsEl(it.tags)), ic('expand_more','chev')), body);
}
const safe = fn => (...a) => { try { return fn(...a); } catch(e){ S.rowErrs = (S.rowErrs || 0) + 1; return h('div',{class:'tx'}, 'Tahle položka se nepodařila zobrazit.'); } };
function secEl(id, icon, title, ...kids){
  return h('div',{class:'block sec', 'data-sec':id}, h('div',{class:'bh'}, h('span',{class:'hic'}, ic(icon)), h('span',null, title)), ...kids);
}
function legsEl(d){
  const legs = arr(d.legs); if (!legs.length) return null;
  const fresh = seenDiff(d).added, doneN = d.date === tokyoDate() ? doneLegCount(d) : 0;
  const row = safe(l => h('div',{class:'leg' + (fresh.includes(legPrint(l)) ? ' changed' : '')}, h('span',{class:'dot'}, ic(l.icon || 'train')),
    h('div',null, l.time ? h('div',{class:'time'}, l.time) : null, h('div',{class:'lt'}, l.text), l.price ? h('div',{class:'lp'}, l.price) : null, linksEl(l))));

// Tokyo minutes since midnight; a leg's clock is its first H:MM ("do 12:50", "8:00–11:30").
const tokyoMins = () => { const n = new Date(Date.now() + 9*3600e3); return n.getUTCHours()*60 + n.getUTCMinutes(); };

const passiveLeg = x => (x.l.icon === 'hotel' && x.c.to != null) || /^Volitelně/.test(x.l.text);
// Which legs are new since this phone last acknowledged the day. First view only remembers.
const legPrint = l => (l.time || '') + '|' + l.text;
const seenAll = () => { try { return JSON.parse(LS.get('jp-seen') || '{}'); } catch(_){ return {}; } };
function seenDiff(d){
  if (d.date < tokyoDate()) return { added:[], removed:0 };
  const now = arr(d.legs).filter(Boolean).map(legPrint), all = seenAll(), old = all[d.date];
  if (!old){ all[d.date] = now; LS.set('jp-seen', JSON.stringify(all)); return { added:[], removed:0 }; }
  return { added: now.filter(x => !old.includes(x)), removed: old.filter(x => !now.includes(x)).length };
}
function changeChip(d){
  const x = seenDiff(d);
  if (!x.added.length && !x.removed) return null;
  return h('button',{class:'changechip', onclick: () => { const all = seenAll(); all[d.date] = arr(d.legs).filter(Boolean).map(legPrint); LS.set('jp-seen', JSON.stringify(all)); render(); }}, ic('update','sm'), 'Plán se změnil', ic('check','sm'));
}

  const parts = String(text).split(/((?:https?:\/\/)?(?:[\w-]+\.)+(?:com|jp|net|org|cz|tokyo)(?:\/[^\s,)]*)?)/g);
  return parts.length < 2 ? text : h('span',null, parts.map((p, i) => i % 2 ? h('a',{href: /^https?:/.test(p) ? p : 'https://' + p, target:'_blank', rel:'noopener'}, p) : p));
}

const CATS = {
  letenky:['Letenky','flight'], ubytovani:['Ubytování','hotel'], doprava:['Doprava a JR Pass','train'], jidlo:['Jídlo a pití','restaurant'],
  vstupy:['Vstupy a zážitky','confirmation_number'], nakupy:['Nákupy a suvenýry','shopping_bag'], poplatky:['Poplatky','account_balance'], ostatni:['Ostatní','more_horiz'] };
function catOf(e){
  if (e.cat && CATS[e.cat]) return e.cat;
  const t = (e.text || '').toLowerCase();
  if (/letenk/.test(t)) return 'letenky';
  if (/ubytov|hotel|ryokan|hostel|kapsl/.test(t)) return 'ubytovani';
  if (/jr pass|vlak|autobus|metro|kitaca|taxi|trajekt|lanovk|šinkansen/.test(t)) return 'doprava';
  if (/snídan|oběd|večeř|kafe|káva|konbini|lawson|jídl|sendvič|ramen|rámen|sushi|pivo|čaj/.test(t)) return 'jidlo';

  if (/suvenýr|nákup|obchod|uniqlo|daiso|drogeri/.test(t)) return 'nakupy';
  if (/poplat|bankomat/.test(t)) return 'poplatky';
  return 'ostatni';
}

// Cumulative spend: point 0 = everything paid before the trip, then one point per trip day up to today.
// Dashed line = even pace from that start to the full budget on the last day.
function trendEl(paid, bud, czk){
  const R = rate(), days = sortedDays().map(d => d.date);
  if (!days.length) return null;
  const start = days[0], end = bud.end || days[days.length - 1], today = tokyoDate();
  const all = []; for (let t = new Date(start + 'T00:00:00Z'); t <= new Date(end + 'T00:00:00Z'); t = new Date(+t + 864e5)) all.push(t.toISOString().slice(0,10));
  const preKc = paid.filter(e => e.pre || e.date < start).reduce((s,e) => s + Number(e.yen), 0) * R;
  const trip = paid.filter(e => !e.pre && e.date >= start);
  const pts = [{ lbl:'Před cestou', v:preKc, add:preKc }];
  let run = preKc;
  for (const d of all){ if (d > today) break; const add = trip.filter(e => e.date === d).reduce((s,e) => s + Number(e.yen), 0) * R; run += add; const p = parts(d); pts.push({ lbl: p.d + '. ' + p.m + '.', v: run, add }); }
  const N = all.length, W = 320, H = 170, L = 44, Rr = 8, T = 12, B = 22;
  const top = Math.max(bud.kc, run) * 1.02, step = 20000, lo = Math.max(0, Math.floor(preKc * 0.95 / step) * step);
  const x = i => L + i / N * (W - L - Rr), y = v => T + (1 - (v - lo) / (top - lo)) * (H - T - B);
  const NS = 'http://www.w3.org/2000/svg';
  const sv = (tag, at, txt) => { const n = document.createElementNS(NS, tag); for (const k in at) n.setAttribute(k, at[k]); if (txt != null) n.textContent = txt; return n; };
  const svg = sv('svg', { viewBox:'0 0 ' + W + ' ' + H, class:'trend', role:'img', 'aria-label':'Útraty od začátku: ' + czk(run) + ' z ' + czk(bud.kc) });
  for (let v = lo; v <= top; v += step){
    svg.append(sv('line', { x1:L, x2:W - Rr, y1:y(v), y2:y(v), class:'grid' }), sv('text', { x:L - 5, y:y(v) + 3, 'text-anchor':'end', class:'ax' }, Math.round(v / 1000) + ' tis.'));
  }
  svg.append(sv('line', { x1:L, x2:W - Rr, y1:y(bud.kc), y2:y(bud.kc), class:'cap' }), sv('text', { x:W - Rr, y:y(bud.kc) - 4, 'text-anchor':'end', class:'ax' }, 'rozpočet ' + czk(bud.kc)));
  svg.append(sv('line', { x1:x(0), y1:y(preKc), x2:x(N), y2:y(bud.kc), class:'pace' }), sv('text', { x:x(N * 0.8), y:y(preKc + (bud.kc - preKc) * 0.8) + 18, 'text-anchor':'start', class:'ax' }, 'rovnoměrné tempo'));
  const path = pts.map((p,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  svg.append(sv('path', { d: path + ' L' + x(pts.length - 1).toFixed(1) + ' ' + (H - B) + ' L' + x(0) + ' ' + (H - B) + ' Z', class:'area' }), sv('path', { d:path, class:'ln' }));
  const li = pts.length - 1, xl = [[0, 'před cestou', 'start'], [N, (p => p.d + '. ' + p.m + '.')(parts(end)), 'end']];
  if (x(li) - x(0) > 70 && x(N) - x(li) > 40) xl.push([li, pts[li].lbl, 'middle']);
  for (const [i, t, a] of xl) svg.append(sv('text', { x:x(i), y:H - 6, 'text-anchor':a, class:'ax' }, t));
  const cross = sv('line', { y1:T, y2:H - B, class:'cross' }), dot = sv('circle', { r:4.5, class:'dot' });
  svg.append(cross, dot);
  const out = h('div',{class:'legend', style:'margin-top:2px'});
  const show = i => { const p = pts[i]; cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(p.v));
    out.textContent = p.lbl + ': celkem ' + czk(p.v) + (i ? ' (ten den ' + czk(p.add) + ')' : ' (letenky, hotely, pass, lístky)'); };
  const pick = ev => { const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W; show(Math.max(0, Math.min(pts.length - 1, Math.round((px - L) / (W - L - Rr) * N)))); };
  svg.addEventListener('pointermove', pick); svg.addEventListener('pointerdown', pick);
  svg.addEventListener('pointerleave', () => show(pts.length - 1));
  show(pts.length - 1);
  return h('div',null, svg, out);
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(env, pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(env.s), iterations:env.it, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(env.i) }, key, b64(env.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function apply(doc){
  const ent = o => Object.entries(o || {}).map(([k,v]) => ({ _id:k, ...v }));
  S.days = ent(doc.days); S.bookings = ent(doc.bookings); S.meta = doc.meta || {};
  S.log = arr(doc.log).slice().sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')) || (b.ts||0) - (a.ts||0));
  S.memories = arr(doc.memories).slice().sort((a,b) => (a.date||'') < (b.date||'') ? -1 : (a.date||'') > (b.date||'') ? 1 : (a.ts||0) - (b.ts||0));
  render();
}

}

    if (!S.days){ const c = LS.get('jp-enc'); if (c) try { const doc = await openEnc(c, pw); apply(doc); lastEnc = c; lastDoc = doc; } catch(_){ S.days = null; } }
    const txt = await netEnc();
    if (txt === null){ if (S.days){ showBanner(`Bez signálu: plán ${planAge()}.`); return true; } throw new Error('offline'); }
    if (txt === lastEnc){ LS.set('jp-enc-at', String(Date.now())); showBanner(''); return true; }
    let doc;
    try { doc = await openEnc(txt, pw); }
    catch(_){ if (S.days){ showBanner(`Nová verze se nepodařila otevřít, ukazuju plán ${planAge()}.`); return true; } throw new Error('badpw'); }
    apply(doc);
    if (S.viewErr && lastDoc){ apply(lastDoc); showBanner(`Nová verze se nepodařila zobrazit, ukazuju plán ${planAge()}.`); return true; }
    lastEnc = txt; lastDoc = doc; LS.set('jp-enc', txt); LS.set('jp-enc-at', String(Date.now())); showBanner('');
    return true;
  } finally { loading = false; }
}
function askPw(){
  const lock = document.getElementById('lock'); lock.classList.remove('hidden');
  const inp = document.getElementById('pw'), err = document.getElementById('pwerr'), btn = document.getElementById('pwgo');
  const tryIt = async () => {
    const pw = inp.value.trim(); if (!pw) return;
    btn.disabled = true;
    try { await load(pw); LS.set('jp-pw', pw); lock.classList.add('hidden'); start(pw); }
    catch(e){ err.textContent = e.message === 'offline' ? 'Bez připojení a bez uložené verze.' : 'Špatné heslo.'; err.classList.remove('hidden'); }
    btn.disabled = false;
  };
  btn.addEventListener('click', tryIt);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') tryIt(); });
  setTimeout(() => inp.focus(), 50);
}
function start(pw){
  setInterval(() => { if (!document.hidden) load(pw).catch(() => {}); }, 5 * 60000);
  tickSync(pw);
  setInterval(() => { if (!document.hidden) tickSync(pw); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden){ clock(); if (S.renderedFor !== tokyoDate()) render(); load(pw).catch(() => {}); tickSync(pw); } });
  setInterval(() => { if (S.view === 'dnes') render(); }, 10 * 60000);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  const m = location.hash.match(/k=([^&]+)/);
  if (m){ LS.set('jp-pw', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.hash.replace(/[#&]?k=[^&]*/, '')); }
  const v = LS.get('jp-view'), dh = dayHash();
  if (dh){ S.view = v && document.getElementById('v-' + v) && v !== 'den' ? v : 'trasa'; S.day = dh; document.querySelectorAll('.navi').forEach(x => { if (x.dataset.v === S.view) x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current'); }); render(); }
  else if (v && document.getElementById('v-' + v)) go(v); else render();
  const pw = LS.get('jp-pw');
  if (!pw) return askPw();
  try { await load(pw); start(pw); }
  catch(e){ if (e.message === 'offline') showBanner('Bez připojení a bez uložené verze.'); else askPw(); }
})();
})();
